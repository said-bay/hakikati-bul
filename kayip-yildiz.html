<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kayıp Yıldız</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: one centered arcade column — pixel screen, dialogue box, two choices, ending tracker */
:root{
  --bg:#0a0a16; --panel:#13132b; --ink:#f2ecd8; --dim:#8f8cad; --accent:#ffd23f; --line:#2c3577; --hot:#ff8c2e; --shadow:#7a1c2c; --deep:#05050c; --ring:#1d2350;
  --display:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --body:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);padding-inline:16px;padding-block:24px 40px;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6.5vw,46px);letter-spacing:.05em;margin:0;color:var(--accent);text-shadow:3px 3px 0 var(--shadow);text-wrap:balance}
.tag{font-size:21px;color:var(--dim)}
.screen{position:relative;border:4px solid var(--line);box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--ring),10px 10px 0 6px var(--deep);background:var(--deep)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 4px)}
canvas{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.place{position:absolute;z-index:1;left:8px;top:8px;font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:rgba(10,10,22,.78);color:var(--ink);padding:4px 8px}
.box{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 6px var(--line);padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;margin-top:6px}
.ending-title{font-family:var(--display);font-weight:700;color:var(--accent);font-size:20px;letter-spacing:.06em;margin:0}
.text{font-size:clamp(22px,4.4vw,27px);line-height:1.15;margin:0;min-height:4.7em;cursor:pointer}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:clamp(21px,4.2vw,25px);line-height:1.1;color:var(--ink);background:transparent;border:2px solid var(--line);padding:9px 12px;cursor:pointer}
.choice .key{font-family:var(--display);font-weight:700;font-size:14px;background:var(--line);color:var(--ink);padding:3px 8px;flex:none}
.choice .lbl{min-width:0}
/* hover only where there is a real mouse; on touch screens a tapped spot stays "hovered" */
.choice:active,.choice:focus-visible{background:var(--accent);color:var(--deep);border-color:var(--accent);outline:none}
@media (hover:hover) and (pointer:fine){.choice:hover{background:var(--accent);color:var(--deep);border-color:var(--accent);outline:none}}
.choice:active .key,.choice:focus-visible .key{background:var(--deep);color:var(--accent)}
@media (hover:hover) and (pointer:fine){.choice:hover .key{background:var(--deep);color:var(--accent)}}
.choice:focus-visible{box-shadow:0 0 0 3px var(--hot)}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;font-size:21px;color:var(--dim)}
.endings{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.endings b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px}
.dot{width:13px;height:13px;background:var(--ring);border:2px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.sound{font:inherit;font-size:20px;color:var(--dim);background:none;border:2px solid var(--line);padding:2px 10px;cursor:pointer}
@media (hover:hover) and (pointer:fine){.sound:hover{color:var(--ink)}}
.sound:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:19px;color:var(--dim);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:480px){.place{font-size:11px;letter-spacing:.08em}.box{padding:14px 14px 16px}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.back{align-self:flex-start;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.08em;color:var(--dim);text-decoration:none;border:2px solid var(--line);padding:5px 10px}
.back:active,.back:focus-visible{color:var(--deep);background:var(--accent);border-color:var(--accent);outline:none}
@media (hover:hover) and (pointer:fine){.back:hover{color:var(--deep);background:var(--accent);border-color:var(--accent)}}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="./#back">‹ Tüm oyunlar</a>
  <header>
    <h1>KAYIP YILDIZ</h1>
    <span class="tag">Bir piksel macerası · 8 farklı son</span>
  </header>

  <div class="screen">
    <canvas id="scene" width="160" height="90" role="img" aria-label="Sahne"></canvas>
    <div class="place" id="place">Köy</div>
  </div>

  <section class="box">
    <p class="ending-title" id="etitle" hidden></p>
    <p class="text" id="text" aria-hidden="true"></p>
    <p class="sr" id="sr" aria-live="polite"></p>
    <div class="choices">
      <button class="choice" id="c1" type="button"><span class="key">1</span><span class="lbl"></span></button>
      <button class="choice" id="c2" type="button"><span class="key">2</span><span class="lbl"></span></button>
    </div>
  </section>

  <footer>
    <div class="endings"><span>Bulunan sonlar: <b id="ecount">0</b>/8</span><div class="dots" id="dots"></div></div>
    <button class="sound" id="snd" type="button">Ses: açık</button>
  </footer>
  <p class="hint">Seçmek için tıkla ya da klavyeden 1 / 2 tuşuna bas. Yazıyı hızlandırmak için metne tıkla.</p>
</div>

<script src="ses.js"></script>
<script>
(() => {
const W = 160, H = 90, GROUND = 72;
const cv = document.getElementById('scene');
const main = cv.getContext('2d');
let g = main;
const OUT = '#0d0b1e';

const C = {
  star:'#f6f2dc', starDim:'#6f7fb8', starMid:'#b9c3e8', moon:'#f3ecd2', moonSh:'#c9bf9f', halo:'#8ea3dc', haloDk:'#4a5a9a',
  yellow:'#ffd23f', gold:'#e89a1c', goldDk:'#a8620f', orange:'#ff8c2e', red:'#d8323c', redDk:'#8e1f33',
  win:'#ffcf5a', winHi:'#fff3b8', winOff:'#1c2550',
  wood:'#7a4a2a', woodDk:'#4f2e1a', woodHi:'#9a6438', woodDeep:'#2e1a0e',
  stone:'#7a7a94', stoneDk:'#4a4a62', stoneHi:'#a0a0b8',
  grass:'#1d6b3a', grassDk:'#124a28', grassHi:'#3a9a4f',
  dirt:'#5a3a22', dirtHi:'#7a5232',
  skin:'#f2b48a', skinSh:'#c98a64', hair:'#5a3418', hairHi:'#8a5428',
  cloak:'#d8323c', cloakDk:'#8e1f33', scarf:'#ffd23f', pants:'#2b3a7a', boot:'#2a1a12', belt:'#4f2e1a',
  water:'#24509e', waterDk:'#173a78', waterHi:'#6f9cf0',
  teal:'#3fd1c9', tealDk:'#1f7f8f', tealHi:'#c8fff8',
  rock:'#2b2340', rockDk:'#1a1428', rockHi:'#4a3d66',
  fog:'#c8c8d8', pink:'#ff7fb0', pinkHi:'#ffd0e2', white:'#f4f1e6', grey:'#9a9ab0', greyDk:'#5e5e78', greyHi:'#c8c8dc',
  roof:'#a83a3a', roofDk:'#6e2230', roofHi:'#cf5a4a', firefly:'#d8ff8a'
};
const PINE_FAR  = ['#06140f','#0a2018','#0e2a1f','#13352a'];
const PINE_MID  = ['#04110c','#0d3622','#134a2f','#1f6b3f'];
const PINE_NEAR = ['#030b08','#0e3d27','#185a35','#2f8a4a'];

/* ---------- pixel helpers ---------- */
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function P(x,y,c){R(x,y,1,1,c);}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ell(cx,cy,rx,ry,c){cx=Math.round(cx);cy=Math.round(cy);for(let dy=-ry;dy<=ry;dy++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));R(cx-hw,cy+dy,hw*2+1,1,c);}}
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const th=(x,y)=>(BAYER[((y%4)+4)%4][((x%4)+4)%4]+.5)/16;
function grad(y0,y1,cols){const n=cols.length-1;for(let y=y0;y<y1;y++){const f=(y-y0)/(y1-y0)*n,i=Math.min(n-1,Math.floor(f)),fr=f-i;let run=0,cur=null;for(let x=0;x<=W;x++){const c=x<W?(fr>th(x,y)?cols[i+1]:cols[i]):null;if(c!==cur){if(cur)R(x-run,y,run,1,cur);cur=c;run=1;}else run++;}}}
function ditherDisc(cx,cy,r,c,d){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy>r*r)continue;if(d>th(cx+dx,cy+dy))P(cx+dx,cy+dy,c);}}
function light(cx,cy,r,c,a){g.save();g.globalCompositeOperation='lighter';[1,.68,.4].forEach((k,i)=>{g.globalAlpha=a*(i+1)/3;const rr=Math.max(1,Math.round(r*k));ell(cx,cy,rr,rr,c);});g.restore();}
function shade(a,c='#020208'){g.globalAlpha=a;R(0,0,W,H,c);g.globalAlpha=1;}
function spr(rows,x,y,map,o=OUT,s=1){
  x=Math.round(x);y=Math.round(y);
  const op=(r,c)=>r>=0&&r<rows.length&&c>=0&&c<rows[r].length&&rows[r][c]!=='.'&&map[rows[r][c]];
  if(o){for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){if(!op(r,c))continue;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(!op(r+dy,c+dx))R(x+(c+dx)*s,y+(r+dy)*s,s,s,o);}}
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++)if(op(r,c))R(x+c*s,y+r*s,s,s,map[rows[r][c]]);
}
function shapes(list,o=OUT){
  if(o)for(const s of list){if(s[0]==='e')ell(s[1],s[2],s[3]+1,s[4]+1,o);else R(s[1]-1,s[2]-1,s[3]+2,s[4]+2,o);}
  for(const s of list){if(s[0]==='e')ell(s[1],s[2],s[3],s[4],s[5]);else R(s[1],s[2],s[3],s[4],s[5]);}
}

/* ---------- world pieces ---------- */
const STARS=(()=>{const r=rng(7),a=[];for(let i=0;i<120;i++)a.push({x:r()*W|0,y:r()*72|0,ph:r()*6.28,b:r()<.1,d:r()<.55});return a;})();
const inMoon=(s,m)=>m&&((s.x-m[0])**2+(s.y-m[1])**2<(m[2]+4)**2);
function starsBg(maxY,m){for(const s of STARS){if(s.y>maxY||inMoon(s,m))continue;if(s.b){P(s.x-1,s.y,C.starDim);P(s.x+1,s.y,C.starDim);P(s.x,s.y-1,C.starDim);P(s.x,s.y+1,C.starDim);P(s.x,s.y,C.star);}else P(s.x,s.y,s.d?C.starDim:C.starMid);}}
function starsFx(t,maxY,m){for(const s of STARS){if(s.y>maxY||inMoon(s,m))continue;const v=Math.sin(t*.3+s.ph);if(v>.8){P(s.x,s.y,C.star);if(s.b){P(s.x-2,s.y,C.starDim);P(s.x+2,s.y,C.starDim);P(s.x,s.y-2,C.starDim);P(s.x,s.y+2,C.starDim);}}}}
function moon(x,y,r){ditherDisc(x,y,r+9,C.haloDk,.18);ditherDisc(x,y,r+5,C.halo,.28);ditherDisc(x,y,r+2,C.halo,.55);
  ell(x,y,r,r,C.moonSh);ell(x-1,y-1,r-1,r-1,C.moon);ell(x+2,y-2,1,1,C.moonSh);ell(x-2,y+2,Math.max(1,r>>2),1,C.moonSh);P(x+3,y+2,C.moonSh);P(x-r+3,y-r+3,C.white);}
function mountains(seed,base,col,colDk,snow){const r=rng(seed),pk=[];for(let i=0;i<5;i++)pk.push([r()*W,12+r()*16]);
  for(let x=0;x<W;x++){let h=0,who=null;for(const p of pk){const v=p[1]-Math.abs(x-p[0])*.75;if(v>h){h=v;who=p;}}h=Math.round(h);if(h<=0)continue;const top=base-h;R(x,top,1,h+30,x>who[0]?colDk:col);if(snow&&h>who[1]-5)R(x,top,1,Math.min(3,h-(who[1]-8)),(x>who[0]&&(x+top)%2)?C.greyHi:snow);}}
function hills(seed,base,amp,col,hi){for(let x=0;x<W;x++){const h=Math.round(amp*(.55+.3*Math.sin(x*.05+seed)+.15*Math.sin(x*.13+seed*2)));R(x,base-h,1,H,col);P(x,base-h,hi);}}
function pine(x,base,h,pal){const[o,d,m,hi]=pal;R(x-1,base-3,3,3,'#2e1c10');R(x-2,base-3,1,3,o);R(x+2,base-3,1,3,o);
  const hh=h-3,top=base-h,tt=Math.max(3,Math.ceil(hh/3));P(x,top-1,o);
  for(let i=0;i<hh;i++){const tier=Math.floor(i/tt),k=i%tt,w=Math.max(0,Math.round(k*.85+tier*1.4));
    R(x-w-1,top+i,w*2+3,1,o);R(x-w,top+i,w*2+1,1,m);const sw=Math.ceil(w*.55);R(x+w-sw+1,top+i,sw,1,d);
    if(w>1&&k%2===0)R(x-w+1,top+i,Math.max(1,Math.floor(w*.4)),1,hi);
    if(k===tt-1&&w>1)for(let j=-w;j<=w;j+=2)P(x+j,top+i,d);}}
function ground(y,base,hi,dk,seed){R(0,y,W,H-y,base);for(let x=0;x<W;x++){P(x,y,hi);if((x*7+seed)%5===0)P(x,y-1,hi);if((x*11+seed)%9===0)P(x,y-2,hi);}
  const r=rng(seed);for(let i=0;i<70;i++){const x=r()*W|0,yy=y+2+(r()*(H-y-2)|0);P(x,yy,r()<.6?dk:hi);}}
function fireflies(t,n,x0,y0,w,h){for(let i=0;i<n;i++){const k=t*.05*(1+i*.13)+i*2.1;const x=x0+(Math.sin(k)*.5+.5)*w,y=y0+(Math.cos(k*1.3+i)*.5+.5)*h;if((t+i*7)%22<15){light(x,y,3,C.firefly,.18);P(x,y,'#f4ffd0');}}}
function smoke(cx,cy,t){for(let i=0;i<5;i++){const a=(t*.8+i*5)%25;g.globalAlpha=Math.max(0,.5-a/25*.5);ell(cx+Math.sin(a*.25+i)*1.5+a*.18,cy-a*.75,a>12?2:1,a>16?2:1,C.greyHi);}g.globalAlpha=1;}
function fire(x,base,t,big=1){const r=rng((t|0)*7+3);
  [[C.redDk,8,10],[C.red,7,9],[C.orange,5,7],[C.yellow,3,4],[C.winHi,1,2]].forEach(([c,w,hm])=>{for(let i=-w;i<=w;i++){const h=Math.round(hm*big*(1-Math.abs(i)/(w+1))*(.6+r()*.6));if(h>0)R(x+i,base-h,1,h,c);}});
  for(let i=0;i<3;i++){const a=((t+i*5)%14);P(x+Math.round((r()-.5)*8),base-10*big-a,a<7?C.yellow:C.orange);}}

const HOUSES=[{x:8,w:20,h:13,p:0},{x:36,w:15,h:11,p:1},{x:84,w:22,h:14,p:0}];
const ROOFS=[[C.roof,C.roofDk,C.roofHi],['#4a6aa8','#2e4478','#7a98d0']];
function houseGeo(hh){const top=GROUND-hh.h,rh=Math.ceil(hh.w/2)+2;return{top,rh,chx:hh.x+hh.w-4,chy:top-rh-2,wx:hh.x+3,wy:top+3};}
function house(hh,lit,dawn){const{x,w,h}=hh,{top,rh,wx,wy}=houseGeo(hh),[rf,rfD,rfH]=ROOFS[hh.p];
  shapes([['r',x+w-5,top-rh-1,3,rh,C.stoneDk]]);R(x+w-5,top-rh-1,1,rh,C.stone);
  R(x-1,top-1,w+2,h+1,OUT);R(x,top,w,h,dawn?'#9a6a48':C.wood);for(let i=x+3;i<x+w;i+=4)R(i,top,1,h,C.woodDk);R(x,top,w,1,C.woodDeep);
  R(x,GROUND-3,w,3,C.stoneDk);for(let i=x;i<x+w;i+=3)P(i,GROUND-2,C.stone);
  for(let i=0;i<rh;i++){const rw=w+4-2*i;if(rw<=0)break;R(x-3+i,top-1-i,rw+2,1,OUT);}
  for(let i=0;i<rh;i++){const rw=w+4-2*i;if(rw<=0)break;R(x-2+i,top-1-i,rw,1,i%2?rf:rfD);P(x-2+i,top-1-i,rfH);if(rw>1)P(x-3+i+rw,top-1-i,rfD);}
  R(wx-1,wy-1,7,6,OUT);R(wx,wy,5,4,lit?C.win:C.winOff);if(lit)R(wx,wy,2,1,C.winHi);R(wx+2,wy,1,4,C.woodDk);R(wx,wy+2,5,1,C.woodDk);
  R(x+w-6,GROUND-8,5,8,OUT);R(x+w-5,GROUND-7,3,7,C.woodDeep);P(x+w-3,GROUND-4,C.yellow);
  if(lit)ditherDisc(wx+2,wy+6,4,C.goldDk,.25);}

/* ---------- sprites ---------- */
const HERO=["...hhh...","..hHHhh..",".hhhhhhh.",".hsssssh.","..sesses.","..sssss..","...SSS...","..yyyyy..",".cyyCccc.",".cccCcccs","s.ccCcc..","..bbbbb..","..ll.ll..","..ll.ll..",".kkk.kkk."];
const HERO_UP=["s.......s","c..hhh..c","c.hHHhh.c","chhhhhhhc",".hsssssh.","..sesses.","..sssss..","...SSS...","..yyyyy..",".ccyyCcc.",".cccCccc.","..bbbbb..","..ll.ll..","..ll.ll..",".kkk.kkk."];
const HM={h:C.hair,H:C.hairHi,s:C.skin,S:C.skinSh,e:OUT,y:C.scarf,c:C.cloak,C:C.cloakDk,b:C.belt,l:C.pants,k:C.boot};
const WISE=["...ppp...","..ppppp..",".pPgggPp.",".pPsssPp.",".pPesePp.",".pPsssPp.","..pgggp..",".ppppppp.","ppppPpppp","spppPppp.",".pppPppp.",".pppPppp.","ppppPpppp","ppppPpppp",".PPP.PPP."];
const WM={p:'#6a55b0',P:'#43347a',g:'#e0e0ee',s:C.skin,e:OUT};
const WOLF=[".g.g............",".gggg..........G","eggGgg.......GG.","nggggg......GG..",".wwgggggggggGG..","..wggggggggggg..","..wwgggGgggggg..","..gg.gg...gg.gg.","..gg.gg...gg.gg.","..kk.kk...kk.kk."];
const WOLF_SIT=[".g.g........",".gggg.......","eggGgg......","nggggg......",".wwggg......","..wgggg.....","..wggggg..G.","..wgggggg.G.","..wwgGgggGG.","..wwgGggggg.","..gg.gggggg.","..kk.kk.kk.."];
const WOLFM={g:'#9a9ab0',G:'#6a6a84',w:'#dcdcea',e:C.yellow,n:OUT,k:'#4a4a5e'};
const STAR=[".....y.....","....yYy....","...yyYyy...","yyyyyyyyyyy",".yYeyyyeyo.","..ypyyypo..","...yyyyo...","..yyyoyyo..","..yyo.oyo..",".yyo...oyo.","yyo.....oo."];
const SM={y:C.yellow,Y:'#fff6c0',o:C.gold,e:OUT,p:C.pink};
const HEART=[".pp.pp.","pPppppp","ppppppp",".ppppp.","..ppp..","...p..."];
const QM=[".qqq.","q...q","....q","...q.","..q..",".....","..q.."];
const ZZ=["zzz","..z",".z.","z..","zzz"];

      g.globalAlpha=.3;R(((t*.6)%(W+40))-40,34,30,2,C.fog);R(((t*.4+90)%(W+40))-40,44,22,2,C.fog);g.globalAlpha=1;

const ENDINGS=['end_lost','end_river','end_fire','end_wrong','end_friend','end_star','end_home','end_sky'];

/* ---------- engine ---------- */
const $=id=>document.getElementById(id);
const textEl=$('text'),srEl=$('sr'),placeEl=$('place'),etitle=$('etitle'),b1=$('c1'),b2=$('c2'),dotsEl=$('dots'),countEl=$('ecount'),sndBtn=$('snd');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let node='start',hist=[],tick=10,typer=null;
const cache=new Map();

function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let found=load('kayip-yildiz-sonlar',[]);if(!Array.isArray(found))found=[];
let soundOn=load('kayip-yildiz-ses',true)!==false;SES.setOn(soundOn);

function beep(f,d=.08){if(soundOn)SES.beep(f,d);}
function jingle(good){if(soundOn)SES.jingle(good);}

function renderDots(){dotsEl.innerHTML='';ENDINGS.forEach(id=>{const d=document.createElement('span');const on=found.includes(id);d.className='dot'+(on?' on':'');d.title=on?STORY[id].title.replace('SON: ',''):'???';dotsEl.appendChild(d);});countEl.textContent=found.length;}
function renderSound(){sndBtn.textContent='Ses: '+(soundOn?'açık':'kapalı');sndBtn.setAttribute('aria-pressed',String(soundOn));}

function draw(){
  const n=STORY[node],sc=SCENES[n.scene],key=n.scene+':'+(n.mode||'');
  let bg=cache.get(key);
  if(!bg){bg=document.createElement('canvas');bg.width=W;bg.height=H;g=bg.getContext('2d');sc.bg(n.mode);cache.set(key,bg);}
  g=main;main.clearRect(0,0,W,H);main.drawImage(bg,0,0);sc.fx(tick,n.mode);main.drawImage(vig,0,0);
}

function type(s){clearInterval(typer);srEl.textContent=s;if(reduce){textEl.textContent=s;return;}let i=0;textEl.textContent='';typer=setInterval(()=>{i+=2;textEl.textContent=s.slice(0,i);if(i>=s.length)clearInterval(typer);},26);}

/* sounds: ambient per scene, effects per story node (see ses.js) */
const SOUND={"amb":{"village:falling":"crickets","hut":"fire","forest":"owl","river":"water","cave":"cave","clearing":"crickets","fly":"sky","village:dawn":"dawn","village:home":"dawn"},"fx":{"start":"fall","wolf":"howl","river":"splash","end_river":"splash","cave":"snore","end_fire":"fireBreath","end_wrong":"sneeze","end_star":"win","end_friend":"wings","clearing":"sparkle","end_sky":"sparkle"}};
function show(){
  const n=STORY[node];SES.scene(SOUND,node,n);
  placeEl.textContent=n.place;
  cv.setAttribute('aria-label','Sahne: '+n.place);
  etitle.hidden=!n.end;
  if(n.end){etitle.textContent=(n.best?'★ ':'')+n.title;if(!found.includes(node)){found.push(node);save('kayip-yildiz-sonlar',found);}renderDots();}
  const ch=n.end?[["Baştan başla","__restart"],["Son seçime geri dön","__back"]]:n.c;
  [b1,b2].forEach((b,i)=>{b.querySelector('.lbl').textContent=ch[i][0];b.dataset.to=ch[i][1];});
  type(n.text);draw();
}

function choose(b){
  const to=b.dataset.to;
  if(to==='__restart'){hist=[];node='start';beep(440);}
  else if(to==='__back'){node=hist.pop()||'start';beep(440);}
  else{hist.push(node);node=to;const n=STORY[to];if(n.end)jingle(!!n.best||['end_friend','end_star','end_home'].includes(to));else beep(b===b1?660:880);}
  show();
}
document.addEventListener('touchstart',()=>{},{passive:true}); // lets :active show while a finger is down on iOS
b1.addEventListener('click',()=>choose(b1));
b2.addEventListener('click',()=>choose(b2));
textEl.addEventListener('click',()=>{clearInterval(typer);textEl.textContent=STORY[node].text;});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='1'){e.preventDefault();choose(b1);}else if(e.key==='2'){e.preventDefault();choose(b2);}});
sndBtn.addEventListener('click',()=>{soundOn=!soundOn;SES.setOn(soundOn);save('kayip-yildiz-ses',soundOn);renderSound();beep(700);});

window.claude?.hot?.snapshot?.(()=>({node,hist}));
function start(d){if(d&&d.node&&STORY[d.node]){node=d.node;hist=Array.isArray(d.hist)?d.hist:[];}renderDots();renderSound();show();
  if(!reduce)setInterval(()=>{tick++;draw();},110);}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
