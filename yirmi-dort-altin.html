<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yirmi Dört Altın</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: one centered column like a coin purse — pixel screen with coin counter, story box, two choices, ending tracker */
:root{
  --bg:#100c18; --panel:#1a1428; --ink:#f4ecd8; --dim:#a89cbc; --accent:#f2c14e; --line:#4a3a6a; --hot:#ff8a4a; --shadow:#6a2a1a; --deep:#06040c; --ring:#241a36;
  --display:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --body:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);padding-inline:16px;padding-block:24px 40px;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,230,.025) 0 1px,transparent 1px 3px)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6.5vw,46px);letter-spacing:.05em;margin:0;color:var(--accent);text-shadow:3px 3px 0 var(--shadow);text-wrap:balance}
.tag{font-size:21px;color:var(--dim)}
.screen{position:relative;border:4px solid var(--line);box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--ring),10px 10px 0 6px var(--deep);background:var(--deep)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 4px)}
canvas{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.place{position:absolute;z-index:1;left:8px;top:8px;font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:rgba(13,15,11,.8);color:var(--ink);padding:4px 8px}
.box{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 6px var(--line);padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;margin-top:6px}
.ending-title{font-family:var(--display);font-weight:700;color:var(--accent);font-size:20px;letter-spacing:.04em;margin:0}
.text{font-size:clamp(21px,4.2vw,26px);line-height:1.15;margin:0;min-height:6.9em;cursor:pointer}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:clamp(21px,4.2vw,25px);line-height:1.1;color:var(--ink);background:transparent;border:2px solid var(--line);padding:9px 12px;cursor:pointer}
.choice .key{font-family:var(--display);font-weight:700;font-size:14px;background:var(--line);color:var(--ink);padding:3px 8px;flex:none}
.choice .lbl{min-width:0}
.choice:hover,.choice:focus-visible{background:var(--accent);color:var(--deep);border-color:var(--accent);outline:none}
.choice:hover .key,.choice:focus-visible .key{background:var(--deep);color:var(--accent)}
.choice:focus-visible{box-shadow:0 0 0 3px var(--hot)}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;font-size:21px;color:var(--dim)}
.endings{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.endings b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px}
.dot{width:13px;height:13px;background:var(--ring);border:2px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.sound{font:inherit;font-size:20px;color:var(--dim);background:none;border:2px solid var(--line);padding:2px 10px;cursor:pointer}
.sound:hover{color:var(--ink)}
.sound:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:19px;color:var(--dim);margin:0}
.source{font-size:18px;color:var(--dim);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:480px){.place{font-size:11px;letter-spacing:.08em}.box{padding:14px 14px 16px}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.back{align-self:flex-start;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.08em;color:var(--dim);text-decoration:none;border:2px solid var(--line);padding:5px 10px}
.back:hover,.back:focus-visible{color:var(--deep);background:var(--accent);border-color:var(--accent);outline:none}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="./#back">‹ Tüm oyunlar</a>
  <header>
    <h1>YİRMİ DÖRT ALTIN</h1>
    <span class="tag">Her saat bir altın · 4 farklı son</span>
  </header>

  <div class="screen">
    <canvas id="scene" width="160" height="90" role="img" aria-label="Sahne"></canvas>
    <div class="place" id="place">Hükümdarın sarayı</div>
  </div>

  <section class="box">
    <p class="ending-title" id="etitle" hidden></p>
    <p class="text" id="text" aria-hidden="true"></p>
    <p class="sr" id="sr" aria-live="polite"></p>
    <div class="choices">
      <button class="choice" id="c1" type="button"><span class="key">1</span><span class="lbl"></span></button>
      <button class="choice" id="c2" type="button"><span class="key">2</span><span class="lbl"></span></button>
    </div>
  </section>

  <footer>
    <div class="endings"><span>Bulunan sonlar: <b id="ecount">0</b>/4</span><div class="dots" id="dots"></div></div>
    <button class="sound" id="snd" type="button">Ses: açık</button>
  </footer>
  <p class="hint">Seçmek için tıkla ya da klavyeden 1 / 2 tuşuna bas. Yazıyı hızlandırmak için metne tıkla.</p>
  <p class="source">Risale-i Nur, Sözler, Dördüncü Söz'deki temsili hikayeden uyarlanmıştır.</p>
</div>

<script src="ses.js"></script>
<script>
(() => {
const W = 160, H = 90, GROUND = 72;
const cv = document.getElementById('scene');
const main = cv.getContext('2d');
let g = main;
const OUT = '#120e10';

const C = {
  star:'#f6f2dc', starDim:'#6f7fb8', starMid:'#b9c3e8', moon:'#f3ecd2', moonSh:'#c9bf9f', halo:'#8ea3dc', haloDk:'#4a5a9a',
  yellow:'#ffd23f', gold:'#e8b048', goldDk:'#a8620f', goldHi:'#fff0a0', orange:'#ff8c2e', red:'#d8323c', redDk:'#8e1f33',
  win:'#ffcf5a', winHi:'#fff3b8',
  wood:'#7a4a2a', woodDk:'#4f2e1a', woodHi:'#9a6438', woodDeep:'#2e1a0e',
  stone:'#9a968a', stoneDk:'#6a665c', stoneHi:'#c0bcae',
  green:'#2f8a4a', greenDk:'#1a5a30', greenHi:'#5ab85f', leaf:'#3fae55', grass:'#5a9a4a', grassHi:'#7ab86a', grassDk:'#3a7a34',
  skin:'#e8a878', skinSh:'#b87a54', mouth:'#8a3a3a',
  water:'#2a6ac4', waterHi:'#8ec0f0',
  white:'#f4f1e6', grey:'#9a9ab0', greyHi:'#d0d0e0', fog:'#e8dcc0',
  dirt:'#a8845a', dirtDk:'#7a5a3a', dirtHi:'#c8a478', pave:'#cfc6b0', paveDk:'#a89e86',
  teal:'#3fd1c9', tealHi:'#c8fff8', pink:'#ff8fb0', steel:'#c8ccd8', steelDk:'#6a6e7c', pack:'#7a5a32', packDk:'#54391e', roll:'#a89068'
};
const SKY = {
  day:['#3a78c8','#5a98dc','#8ac0ec','#c4e2f4','#f2ead0'],
  dusk:['#1e1a4a','#4a2a6a','#9a3a6a','#e0644a','#f6a050'],
  dawn:['#2a2350','#5a3f88','#b0628a','#f2956a','#ffd08a'],
  night:['#06051a','#0e1440','#1a2560','#2a3d7e'],
  grey:['#3a3e48','#4a4e58','#5a5e68','#6a6e76','#7a7e84']
};

/* ---------- pixel helpers ---------- */
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function P(x,y,c){R(x,y,1,1,c);}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ell(cx,cy,rx,ry,c){cx=Math.round(cx);cy=Math.round(cy);rx=Math.max(0,Math.round(rx));ry=Math.max(0,Math.round(ry));if(ry===0){R(cx-rx,cy,rx*2+1,1,c);return;}for(let dy=-ry;dy<=ry;dy++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));R(cx-hw,cy+dy,hw*2+1,1,c);}}
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const th=(x,y)=>(BAYER[((y%4)+4)%4][((x%4)+4)%4]+.5)/16;
function grad(y0,y1,cols){const n=cols.length-1;for(let y=y0;y<y1;y++){const f=(y-y0)/(y1-y0)*n,i=Math.min(n-1,Math.floor(f)),fr=f-i;let run=0,cur=null;for(let x=0;x<=W;x++){const c=x<W?(fr>th(x,y)?cols[i+1]:cols[i]):null;if(c!==cur){if(cur)R(x-run,y,run,1,cur);cur=c;run=1;}else run++;}}}
function ditherDisc(cx,cy,r,c,d){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy>r*r)continue;if(d>th(cx+dx,cy+dy))P(cx+dx,cy+dy,c);}}
function light(cx,cy,r,c,a){g.save();g.globalCompositeOperation='lighter';[1,.68,.4].forEach((k,i)=>{g.globalAlpha=a*(i+1)/3;const rr=Math.max(1,Math.round(r*k));ell(cx,cy,rr,rr,c);});g.restore();}
function shade(a,c='#020208'){g.globalAlpha=a;R(0,0,W,H,c);g.globalAlpha=1;}
function shadow(cx,base,rx){g.globalAlpha=.28;ell(cx,base,rx,1,'#2a1418');g.globalAlpha=1;}
function line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(;;){P(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function spr(rows,x,y,map,o=OUT,flip=false){
  x=Math.round(x);y=Math.round(y);
  const wid=Math.max(...rows.map(r=>r.length));
  const op=(r,c)=>r>=0&&r<rows.length&&c>=0&&c<rows[r].length&&rows[r][c]!=='.'&&map[rows[r][c]];
  const X=c=>x+(flip?wid-1-c:c);
  if(o){for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){if(!op(r,c))continue;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(!op(r+dy,c+dx))R(X(c+dx),y+r+dy,1,1,o);}}
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++)if(op(r,c))R(X(c),y+r,1,1,map[rows[r][c]]);
}
function shapes(list,o=OUT){
  if(o)for(const s of list){if(s[0]==='e')ell(s[1],s[2],s[3]+1,s[4]+1,o);else R(s[1]-1,s[2]-1,s[3]+2,s[4]+2,o);}
  for(const s of list){if(s[0]==='e')ell(s[1],s[2],s[3],s[4],s[5]);else R(s[1],s[2],s[3],s[4],s[5]);}
}
function bubble(x,y,t,mark){shapes([['r',x,y,15,8,C.white]]);R(x+3,y+8,2,2,C.white);P(x+2,y+10,C.white);
  if(mark==='!'){R(x+7,y+1,1,4,OUT);P(x+7,y+6,OUT);}else if(mark==='?'){R(x+6,y+1,3,1,OUT);P(x+9,y+2,OUT);P(x+8,y+3,OUT);P(x+7,y+4,OUT);P(x+7,y+6,OUT);}
  else if(t%9>2){P(x+3,y+4,OUT);P(x+7,y+4,OUT);P(x+11,y+4,OUT);}}

/* ---------- world pieces ---------- */
Object.assign(C,{cobble:'#c8b494',cobbleDk:'#a8946e',wall:'#f2e8d4',wallSh:'#d8c8a8',canteen:'#6a7a6a',strap:'#6a4a2a',gaiter:'#ece4cc'});
const STARS=(()=>{const r=rng(7),a=[];for(let i=0;i<120;i++)a.push({x:r()*W|0,y:r()*72|0,ph:r()*6.28,b:r()<.1,d:r()<.55});return a;})();
const inMoon=(s,m)=>m&&((s.x-m[0])**2+(s.y-m[1])**2<(m[2]+4)**2);
function starsBg(maxY,m){for(const s of STARS){if(s.y>maxY||inMoon(s,m))continue;if(s.b){P(s.x-1,s.y,C.starDim);P(s.x+1,s.y,C.starDim);P(s.x,s.y-1,C.starDim);P(s.x,s.y+1,C.starDim);P(s.x,s.y,C.star);}else P(s.x,s.y,s.d?C.starDim:C.starMid);}}
function starsFx(t,maxY,m){for(const s of STARS){if(s.y>maxY||inMoon(s,m))continue;const v=Math.sin(t*.3+s.ph);if(v>.8){P(s.x,s.y,C.star);if(s.b){P(s.x-2,s.y,C.starDim);P(s.x+2,s.y,C.starDim);P(s.x,s.y-2,C.starDim);P(s.x,s.y+2,C.starDim);}}}}
function milkyWay(slope,off){for(let x=0;x<W;x++)for(let y=0;y<56;y++){const d=Math.abs(y-(off+x*slope));if(d<7&&(1-d/7)*.4>th(x,y))P(x,y,'#34407e');}}
function moon(x,y,r){ditherDisc(x,y,r+9,C.haloDk,.18);ditherDisc(x,y,r+5,C.halo,.28);ditherDisc(x,y,r+2,C.halo,.55);ell(x,y,r,r,C.moonSh);ell(x-1,y-1,r-1,r-1,C.moon);ell(x+2,y-2,1,1,C.moonSh);P(x+3,y+2,C.moonSh);P(x-r+3,y-r+3,C.white);}
function sun(x,y,r,warm){const hc=warm?'#ffd8a0':'#fff4c8';ditherDisc(x,y,r+9,hc,.18);ditherDisc(x,y,r+5,hc,.35);ditherDisc(x,y,r+2,hc,.6);ell(x,y,r,r,warm?'#ffd070':'#fff0a0');ell(x-1,y-1,r-2,r-2,warm?'#ffe8a8':'#fffbe0');}
function cloud(x,y,w,dark){const c=dark?'#5a606e':'#d8e4f4',hi=dark?'#6e7482':'#ffffff',dk=dark?'#3e434e':'#b8c8e0';ell(x,y+1,w,2,dk);ell(x,y,w,2,c);ell(x-w*.35,y-1,w*.45,2,c);ell(x+w*.25,y-2,w*.4,2,hi);ell(x-w*.3,y-2,w*.25,1,hi);}
function clouds(t,list,dark){list.forEach(([x0,y,w],i)=>{const x=((x0+t*(.12+i*.04))%(W+50))-25;cloud(x,y,w,dark);});}
function birds(t,n,y0){for(let i=0;i<n;i++){const bx=((t*.9+i*37)%(W+20))-10,by=y0+i*5+Math.round(Math.sin(t*.4+i)),up=(t+i)%6<3;P(bx,by,OUT);P(bx-1,by-(up?1:0),OUT);P(bx+1,by-(up?1:0),OUT);P(bx-2,by-(up?1:-1),OUT);P(bx+2,by-(up?1:-1),OUT);}}
function crows(t,n){for(let i=0;i<n;i++){const bx=((t*.6+i*53)%(W+20))-10,by=14+i*7,up=(t+i)%8<4;R(bx-1,by,3,1,OUT);P(bx-2,by-(up?1:-1),OUT);P(bx+2,by-(up?1:-1),OUT);P(bx-3,by-(up?2:-1),OUT);P(bx+3,by-(up?2:-1),OUT);}}
function vultures(t,cx,cy){for(let i=0;i<2;i++){const a=t*.05+i*Math.PI,x=cx+Math.cos(a)*16,y=cy+Math.sin(a)*5,up=(t+i)%10<5;R(x-1,y,3,1,'#2a2024');R(x-4,y-(up?1:0),3,1,'#2a2024');R(x+2,y-(up?1:0),3,1,'#2a2024');P(x-5,y-(up?2:-1),'#2a2024');P(x+5,y-(up?2:-1),'#2a2024');}}
function notes(t,x,y){[0,1,2].forEach(i=>{const a=(t*.8+i*9)%26;if(a<20){const nx=x+i*5+Math.sin(a*.4+i)*2,ny=y-a,c=[C.yellow,C.pink,C.tealHi][i];R(nx,ny,2,2,c);R(nx+1,ny-4,1,4,c);P(nx+2,ny-4,c);P(nx+3,ny-3,c);}});}
function hillsBand(seed,base,amp,c,hi){for(let x=0;x<W;x++){const h=Math.round(amp*(.55+.3*Math.sin(x*.05+seed)+.15*Math.sin(x*.13+seed*2)));R(x,base-h,1,h+40,c);P(x,base-h,hi);}}
function mountains(seed,base,col,colDk,snow){const r=rng(seed),pk=[];for(let i=0;i<5;i++)pk.push([r()*W,10+r()*14]);
  for(let x=0;x<W;x++){let h=0,who=null;for(const p of pk){const v=p[1]-Math.abs(x-p[0])*.75;if(v>h){h=v;who=p;}}h=Math.round(h);if(h<=0)continue;const top=base-h;R(x,top,1,h+30,x>who[0]?colDk:col);if(snow&&h>who[1]-5)R(x,top,1,Math.min(3,h-(who[1]-8)),snow);}}
function cypress(x,base,h,c='#1e5a3a',hi='#2e7a4a'){shapes([['e',x,base-h/2,3,Math.round(h/2),c]]);ell(x-1,base-h/2-1,1,Math.round(h/2)-2,hi);R(x,base-2,1,2,C.woodDk);}
function pine(x,base,h,pal){const[o,d,m,hi]=pal;R(x-1,base-3,3,3,'#2e1c10');const hh=h-3,top=base-h,tt=Math.max(3,Math.ceil(hh/3));P(x,top-1,o);
  for(let i=0;i<hh;i++){const tier=Math.floor(i/tt),k=i%tt,w=Math.max(0,Math.round(k*.85+tier*1.4));R(x-w-1,top+i,w*2+3,1,o);R(x-w,top+i,w*2+1,1,m);const sw=Math.ceil(w*.55);R(x+w-sw+1,top+i,sw,1,d);if(w>1&&k%2===0)R(x-w+1,top+i,Math.max(1,Math.floor(w*.4)),1,hi);}}
const PINE_FAR=['#06140f','#0a2018','#0e2a1f','#13352a'],PINE_NEAR=['#030b08','#0e3d27','#185a35','#2f8a4a'];
function bareTree(x,base,h,c='#4a3a3a'){line(x,base,x,base-h,c);line(x,base-h*.5,x-6,base-h*.8,c);line(x,base-h*.6,x+5,base-h*.95,c);line(x-3,base-h*.65,x-5,base-h,c);line(x,base-h*.8,x+2,base-h-2,c);R(x-1,base-h*.4,1,h*.4,c);}
function thorns(x,base,w){for(let i=0;i<w;i+=2){line(x+i,base,x+i+((i*7)%3)-1,base-3-((i*5)%3),'#5a4a2a');P(x+i,base-4,'#8a3a3a');}}
function tree(x,base,r){shapes([['r',x-1,base-r-6,3,r+6,C.wood]]);R(x-1,base-r-6,1,r+6,C.woodHi);shapes([['e',x,base-r-8,r,r-1,C.green]]);ell(x-2,base-r-10,r-3,r-4,C.leaf);ell(x-3,base-r-12,Math.max(1,r-6),Math.max(1,r-7),C.greenHi);}
function fire(x,base,t){const r=rng((t|0)*7+3);

        for(let i=0;i<5;i++){const a=t*.15+i*1.25;P(80+Math.cos(a)*60,30+Math.sin(a)*8,i%2?C.white:C.goldHi);}}

};

/* ---------- coin counter (top-right) ---------- */
function hud(cfg,t){if(!cfg)return;
  if(cfg.mode==='ticket'||cfg.mode==='glow'){shapes([['r',W-54,3,51,11,'#1a1426']]);for(let i=0;i<24;i++){const x=W-51+(i%12)*4,y=6+Math.floor(i/12)*5,on=cfg.mode==='glow'||i===23;coin(x+1,y,on?C.gold:'#5a5a6a',on?C.goldHi:'#7a7a8a');}
    if(cfg.mode==='ticket'){light(W-5,11,4,C.gold,.15);}else if(t%6<3)P(W-30,4,C.white);return;}
  let n=cfg.n;if(cfg.from!==undefined){n=Math.max(cfg.to,Math.round(cfg.from-(t-cfg.t0)*1.2));}
  const s=String(n),w=s.length*4+12;shapes([['r',W-w-4,3,w+1,9,'#1a1426']]);bigCoin(W-w+1,7);text3(s,W-w+6,5,n>=1000?C.goldHi:(n<=1?'#ff8a7a':C.white));
  if(n>=1000&&t%6<3)P(W-w+3,4,C.white);}

const vig=document.createElement('canvas');vig.width=W;vig.height=H;
g=vig.getContext('2d');
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=(x-W/2)/(W/2),dy=(y-H/2)/(H/2),v=(dx*dx*.8+dy*dy*1.1-.9)/.7;if(v>th(x,y))P(x,y,'#060410');}

const ENDINGS=['end_best','end_forgiven','end_desert','end_alone'];

/* ---------- engine ---------- */
const $=id=>document.getElementById(id);
const textEl=$('text'),srEl=$('sr'),placeEl=$('place'),etitle=$('etitle'),b1=$('c1'),b2=$('c2'),dotsEl=$('dots'),countEl=$('ecount'),sndBtn=$('snd');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let node='start',hist=[],tick=10,typer=null,shownAt=0;
const cache=new Map();

function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let found=load('yirmi-dort-altin-sonlar',[]);if(!Array.isArray(found))found=[];
let soundOn=load('yirmi-dort-altin-ses',true)!==false;SES.setOn(soundOn);

function beep(f,d=.08){if(soundOn)SES.beep(f,d);}
function jingle(good){if(soundOn)SES.jingle(good);}

function renderDots(){dotsEl.innerHTML='';ENDINGS.forEach(id=>{const d=document.createElement('span');const on=found.includes(id);d.className='dot'+(on?' on':'');d.title=on?STORY[id].title.replace('SON: ',''):'???';dotsEl.appendChild(d);});countEl.textContent=found.length;}
function renderSound(){sndBtn.textContent='Ses: '+(soundOn?'açık':'kapalı');sndBtn.setAttribute('aria-pressed',String(soundOn));}

function renderInto(canvas,scene,mode){
  const ctx=canvas.getContext('2d'),key=scene+':'+(mode||'');
  let bg=cache.get(key);
  if(!bg){bg=document.createElement('canvas');bg.width=W;bg.height=H;g=bg.getContext('2d');SCENES[scene].bg(mode);cache.set(key,bg);}
  g=ctx;ctx.clearRect(0,0,W,H);ctx.drawImage(bg,0,0);SCENES[scene].fx(tick,mode);g=main;
}
function draw(){const n=STORY[node];renderInto(cv,n.scene,n.mode);main.drawImage(vig,0,0);g=main;
  if(n.hud){const cfg=Object.assign({},n.hud);if(cfg.from!==undefined){cfg.t0=reduce?-999:shownAt;}hud(cfg,tick);}}

function type(s){clearInterval(typer);srEl.textContent=s;if(reduce){textEl.textContent=s;return;}let i=0;textEl.textContent='';typer=setInterval(()=>{i+=2;textEl.textContent=s.slice(0,i);if(i>=s.length)clearInterval(typer);},24);}

/* sounds: ambient per scene, effects per story node (see ses.js) */
const SOUND={"amb":{"palace":"quiet","bazaar:choice":"market","bazaar:trade":"market","bazaar:gamble":"dice","bazaar:stop":"dice","station":"crowd","sky:flight":"engine","sky:speed":"sky","farm":"birds","prayer":"quiet","lottery":"crowd","desert":"wind"},"fx":{"start":"coins","trade":"coins","gamble":["coinLose","dice"],"gamble_more":"dice","station_good":"whistle","station_bad":"whistle","end_alone":"whistle","speed":"zap","lottery":"wheel","end_desert":"gust"}};
function show(){
  const n=STORY[node];SES.scene(SOUND,node,n);shownAt=tick;
  placeEl.textContent=n.place;
  cv.setAttribute('aria-label','Sahne: '+n.place);
  etitle.hidden=!n.end;
  if(n.end){etitle.textContent=(n.best?'★ ':'')+n.title;if(!found.includes(node)){found.push(node);save('yirmi-dort-altin-sonlar',found);}renderDots();}
  const ch=n.end?[["Baştan başla","__restart"],["Son seçime geri dön","__back"]]:n.c;
  [b1,b2].forEach((b,i)=>{b.querySelector('.lbl').textContent=ch[i][0];b.dataset.to=ch[i][1];});
  type(n.text);draw();
}

function choose(b){
  let to=b.dataset.to;
  if(to==='__final')to=hist.includes('gamble')?'end_forgiven':'end_best';
  if(to==='__restart'){hist=[];node='start';beep(440);}
  else if(to==='__back'){node=hist.pop()||'start';beep(440);}
  else{hist.push(node);node=to;const n=STORY[to];if(n.end)jingle(to!=='end_desert'&&to!=='end_alone');else if(to==='gamble')[440,392,349,330,294].forEach((f,i)=>setTimeout(()=>beep(f,.07),i*90));else if(to==='trade')[784,988,1175].forEach((f,i)=>setTimeout(()=>beep(f,.08),i*80));else beep(b===b1?660:880);}
  show();
}
b1.addEventListener('click',()=>choose(b1));
b2.addEventListener('click',()=>choose(b2));
textEl.addEventListener('click',()=>{clearInterval(typer);textEl.textContent=STORY[node].text;});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='1'){e.preventDefault();choose(b1);}else if(e.key==='2'){e.preventDefault();choose(b2);}});
sndBtn.addEventListener('click',()=>{soundOn=!soundOn;SES.setOn(soundOn);save('yirmi-dort-altin-ses',soundOn);renderSound();beep(700);});

window.claude?.hot?.snapshot?.(()=>({node,hist}));
function start(d){if(d&&d.node&&STORY[d.node]){node=d.node;hist=Array.isArray(d.hist)?d.hist:[];}renderDots();renderSound();show();
  if(!reduce)setInterval(()=>{tick++;draw();},110);}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
